name: "AI Code Review"
description: "PR 에 CodeRabbit 형식의 AI 코드 리뷰를 남긴다 (walkthrough + mermaid + 심각도별 인라인 코멘트)"
author: "Jung-eunwoo"

branding:
  icon: "message-square"
  color: "purple"

inputs:
  pr:
    description: "리뷰할 PR 번호"
    required: true
  repo:
    description: "대상 저장소 (owner/name). 기본값은 워크플로가 도는 저장소"
    required: false
    default: ${{ github.repository }}
  provider:
    description: "분석 프로바이더 (gemini | claude)"
    required: false
    default: "gemini"
  model:
    description: "모델명. 생략하면 프로바이더 기본값 (gemini-flash-latest / opus)"
    required: false
  post:
    description: "false 면 게시하지 않고 로그로만 출력한다 (도입 전 시범 운영용)"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # 리뷰어 코드를 체크아웃하지 않는다.
    # `uses:` 로 불린 시점에 GitHub 이 이 저장소를 $GITHUB_ACTION_PATH 에 이미 내려놨다.
    #
    # ⚠️ composite action 안에서 `github.action_repository` 를 쓰면 안 된다.
    #    그 값은 "현재 실행 중인 액션"으로 해석돼서, 중첩된 actions/checkout 단계에서는
    #    actions/checkout 자신을 가리킨다. 실제로 그렇게 만들었다가
    #    엉뚱한 저장소를 받아와 MODULE_NOT_FOUND 로 죽었다.
    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    # gemini 는 REST 직접 호출이라 설치할 게 없다.
    # claude 를 쓸 때만 CLI 를 깐다.
    - name: claude CLI 설치
      if: inputs.provider == 'claude'
      shell: bash
      run: npm i -g @anthropic-ai/claude-code

    - name: 리뷰 실행
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        node review.mjs "${{ inputs.pr }}" \
          --repo "${{ inputs.repo }}" \
          --provider "${{ inputs.provider }}" \
          ${{ inputs.model && format('--model "{0}"', inputs.model) || '' }} \
          ${{ inputs.post == 'true' && '--post' || '' }}
