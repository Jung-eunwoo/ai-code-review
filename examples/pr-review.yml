# 리뷰를 붙일 저장소의 .github/workflows/ai-review.yml 로 복사한다.
# Jung-eunwoo/ai-code-review 부분만 본인 저장소로 바꾸면 끝이다.
name: AI Code Review

# ⛔ pull_request_target 으로 바꾸지 마라.
#    그 트리거는 시크릿과 쓰기 토큰이 주입된 상태로 **PR 브랜치 코드**를 돌린다.
#    포크에서 리뷰가 안 돈다는 이유로 여기를 바꾸는 순간, 아무나 PR 하나로
#    이 저장소의 시크릿을 가져갈 수 있게 된다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# GH_TOKEN 이 리뷰를 남기려면 write 가 필요하다
permissions:
  contents: read
  pull-requests: write

# 같은 PR 에 push 가 연달아 오면 이전 리뷰 작업을 취소한다 (중복 리뷰·비용 방지)
concurrency:
  group: ai-review-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # 포크 PR 은 시크릿이 주입되지 않아 어차피 실패한다 → 아예 돌리지 않는다
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # ⚠️ 전체 커밋 SHA 로 고정한다. @main 이나 @v1 같은 이동 가능한 ref 를 쓰면
      #    업스트림이 바뀌는 순간 검토되지 않은 코드가 이 저장소의 GEMINI_API_KEY 와
      #    pull-requests: write 권한으로 실행된다.
      #    올릴 때는 리뷰어 저장소의 diff 를 보고 SHA 를 손으로 바꾼다.
      - uses: Jung-eunwoo/ai-code-review@01365adee404635cbb79c25b9f6f100ff8b2daff # main 기준
        with:
          pr: ${{ github.event.number }}
          # 더 정확한 판정이 필요하면 model: gemini-pro-latest
        env:
          # AI Studio 키 하나면 된다: https://aistudio.google.com/apikey
          #   gh secret set GEMINI_API_KEY --repo OWNER/REPO
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
